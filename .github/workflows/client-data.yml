name: Client data boundaries
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/
            !/artifacts/
            /assets/**/
            !/assets/**/*.*
            /assets/**/*.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.tmp/*.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-
      - run: npm run client-data:check
      - name: Client regressions (one test runner)
        run: npm run test:client-data -- tests/relic-recycling-ui.test.tsx tests/relic-recycling-api.test.ts tests/relic-roulette-api.test.ts tests/relic-roulette-ui.test.tsx tests/relic-roulette-model.test.ts tests/header-place-navigation.test.tsx tests/deployment-tools.test.ts tests/merchant-orders-ui.test.tsx tests/port-page.test.tsx tests/expedition-tailwind-ui.test.tsx tests/farm-overview.test.ts tests/farm-overview-ui.test.tsx tests/topview-farm.test.tsx tests/farm-starter-presentation.test.tsx tests/farm-starting-limits.test.ts tests/farm-crafting-visibility.test.tsx tests/farm-land.test.ts tests/farm-map-boundary.test.ts tests/theme-panorama.test.ts
      - name: Farm and hologram region regressions
        run: npm test -- --maxWorkers=1 --testTimeout=15000 tests/farm-visits.test.tsx tests/farm-visits-api.test.ts tests/farm-friends-loading.test.tsx tests/farm-access.test.tsx tests/farm-camera.test.tsx tests/farm-seed-drag.test.tsx tests/farm-warehouse-cost.test.ts tests/farm-warehouse-expansion.test.tsx tests/farm-warehouse-expansion-limits.test.tsx tests/farm-receipts.test.tsx tests/farm-purchase-effect.test.tsx tests/farm-purchase-feedback.test.tsx tests/farm-harvesting-effect.test.tsx tests/hologram-region.test.ts
      - name: Farm queue and paid billiards regressions
        run: npm test -- --maxWorkers=1 --testTimeout=15000 tests/farm-command-queue.test.ts tests/farm-account-retry.test.tsx tests/farm-interaction-feedback.test.tsx tests/billiards-ui.test.tsx tests/billiards-api.test.ts tests/billiards.test.ts
      - name: Operator pet sandbox regressions
        run: npm test -- --maxWorkers=1 --testTimeout=15000 tests/pet-preview-model.test.ts tests/pet-enhancement.test.ts tests/pet-preview-ui.test.tsx tests/pet-preview-assets.test.ts tests/pet-idle-animation.test.ts tests/pet-needs-animation.test.ts tests/pet-sprite-transition.test.tsx tests/pet-sprite-images.test.ts tests/pet-draw-layout.test.ts tests/pet-jobs-panel.test.tsx tests/operator-guard.test.tsx tests/header-place-navigation.test.tsx tests/page-navigation.test.tsx
      - name: Weather artwork, decorations and preview regressions
        run: npm test -- --maxWorkers=1 --testTimeout=15000 tests/weather-decorations.test.ts tests/shared-decoration-animation.test.ts tests/weather-pongi-assets.test.ts tests/weather-pongi-picker.test.tsx tests/development-weather-catalog.test.ts tests/fishing-weather.test.tsx tests/mythic-swim.test.ts
      - name: Pet house storefront and animation regressions
        run: npm test -- --maxWorkers=1 --testTimeout=30000 tests/pet-snack-shop.test.tsx tests/pet-job-cancel.test.ts tests/pet-ground.test.ts tests/pet-horizontal.test.ts tests/bait-shop-ui.test.tsx tests/bait-shop-filters.test.ts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-build-report
          path: artifacts/deploy/build-report.json
          if-no-files-found: ignore
          retention-days: 7
