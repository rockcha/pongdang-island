name: Database consistency
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/
            !/artifacts/
            /assets/**/
            !/assets/**/*.*
            /assets/**/*.json
            !/public/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:verify
      - run: npm run arcade:engine:check
      - run: npm run exploration:engine:check
      - name: Database and server regressions (one test runner)
        run: npm test -- --maxWorkers=2 tests/relic-roulette-sql.test.ts tests/exploration-reward-sql.test.ts tests/exploration-server-engine.test.ts tests/exploration-edge.test.ts tests/brick-game-sql.test.ts tests/brick-breaker-replay.test.ts tests/brick-edge.test.ts tests/social-sql.test.ts tests/aquarium-social-sql.test.ts tests/native-collectibles-sql.test.ts tests/regional-fishing-sql.test.ts tests/collectible-movement-sql.test.ts
