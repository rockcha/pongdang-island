<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>넓어진 어항 테마</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1ebe1;color:#533d30;font:14px system-ui,sans-serif}header{padding:24px;max-width:1400px;margin:auto}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0}a{color:inherit}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding:0 24px 24px;max-width:1400px;margin:auto}article{background:#fffaf2;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #533d3010}h2{font-size:15px;margin:12px 16px}figure{margin:0;position:relative}figure img{display:block;width:100%;aspect-ratio:27/16;object-fit:cover}figure:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent calc(33.333% - .5px),#fff6 33.333%,transparent calc(33.333% + .5px),transparent calc(66.666% - .5px),#fff6 66.666%,transparent calc(66.666% + .5px))}.thirds{display:flex;justify-content:space-around;font-size:11px;padding:6px;background:#e8dccb}.links{padding:12px 16px;display:flex;justify-content:space-between;font-size:12px}nav{display:flex;gap:16px;margin-top:16px}@media(max-width:650px){main{grid-template-columns:1fr;padding:0 12px 12px;gap:12px}header{padding:20px 12px}}
</style>
<header><h1>세 칸으로 넓어진 어항</h1><p>기존 분위기를 살려 왼쪽·가운데·오른쪽에 풍경을 나누었습니다.</p><a href="/aquarium-lab">물고기와 함께 둘러보기 →</a><nav id="pages"></nav></header><main></main>
<script type="module">
const manifest=await(await fetch('/assets/storage-upload/new/20261025-014955/manifest.json')).json();
const catalog=await(await fetch('/supabase/catalog/catalog.json')).json();
const page=new URLSearchParams(location.search).get('page');
for(let i=0;i<Math.ceil(manifest.files.length/8);i++){const a=document.createElement('a');a.href='?page='+i;a.textContent=String(i+1);document.querySelector('nav').append(a)}
manifest.files.forEach((file,index)=>{if(page!==null&&Math.floor(index/8)!==+page)return;const theme=catalog.aquarium_backgrounds.find(t=>t.id===file.theme_id);const article=document.createElement('article');const title=document.createElement('h2');title.textContent=theme.name;article.append(title);const figure=document.createElement('figure');const img=new Image();if(page===null)img.loading='lazy';img.src='/assets/storage-upload/new/20261025-014955/'+file.local_path;img.alt=theme.name;figure.append(img);article.append(figure);const thirds=document.createElement('div');thirds.className='thirds';for(const label of ['왼쪽','가운데','오른쪽']){const span=document.createElement('span');span.textContent=label;thirds.append(span)}article.append(thirds);const links=document.createElement('div');links.className='links';for(const [label,url] of [['원본 보기','/'+file.source_image],['어항에서 보기','/aquarium-lab?theme='+theme.id]]){const a=document.createElement('a');a.href=url;a.textContent=label;links.append(a)}article.append(links);document.querySelector('main').append(article)});
</script></html>
