<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호루스 위치 튐 비교</title><style>body{margin:0;padding:24px;background:#fff8ed;color:#62472d;font:15px system-ui}h1{font-size:20px}main{display:flex;gap:16px;flex-wrap:wrap}section{border:1px solid #ddc3a0;border-radius:16px;padding:12px;background:#f3e4cc}canvas{width:min(40vw,380px);height:auto;display:block}button,input{margin:12px 10px 0 0}p{color:#927657;font-size:13px}</style><h1>호루스 · 복귀 프레임 정렬 비교</h1><main><section>이전<canvas id="before" width="624" height="624"></canvas></section><section>수정<canvas id="after" width="624" height="624"></canvas></section></main><button id="play">일시 정지</button><button id="recovery">복귀 자세 비교</button><label><input id="mirror" type="checkbox">좌우 반전</label><p id="phase"></p><script>
const base=location.protocol==='file:'?'../../../public':'';
const images=[1,2].map(v=>{const i=new Image();i.src=base+'/aquarium/swim/pharaoh-gold-wing-horus_swim8_v'+v+'_sprite.png';return i});
const glide=[0,1,2,3,2,1],flourish=[2,3,4,3,2,5,5,2,6,3,7,0];let playing=true,phase=0,last=performance.now(),loops=0;
function frame(v){return phase<4?glide[Math.floor(phase*3)%6]:v===1?4+Math.min(3,Math.floor((phase-4)*2)):flourish[Math.min(11,Math.floor((phase-4)*6))]}
function draw(){images.forEach((image,index)=>{if(!image.complete||!image.naturalWidth)return;const canvas=document.getElementById(index?'after':'before'),ctx=canvas.getContext('2d'),f=frame(index+1),cell=image.naturalWidth/4;ctx.clearRect(0,0,624,624);ctx.save();if(document.getElementById('mirror').checked){ctx.translate(624,0);ctx.scale(-1,1)}ctx.drawImage(image,f%4*cell,Math.floor(f/4)*cell,cell,cell,0,0,624,624);ctx.strokeStyle='#a47f4b66';ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(0,315);ctx.lineTo(624,315);ctx.stroke();ctx.restore()});document.getElementById('phase').textContent=phase.toFixed(2)+'초 / 6초 · '+loops+'회 반복'}
function tick(now){if(playing){const next=phase+(now-last)/1000;if(next>=6)loops+=Math.floor(next/6);phase=next%6}last=now;draw();requestAnimationFrame(tick)}
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'일시 정지':'재생'};
document.getElementById('recovery').onclick=()=>{playing=false;phase=5.7;document.getElementById('play').textContent='재생';draw()};
window.horusReview={ready:()=>images.every(i=>i.complete&&i.naturalWidth),recovery:()=>document.getElementById('recovery').click()};requestAnimationFrame(tick);
</script></html>
