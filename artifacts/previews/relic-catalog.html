<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유물 16종 로컬 미리보기</title><style>body{margin:0;background:#fff8ee;color:#4a3527;font:14px system-ui}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:22px}#relics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}article{border:1px solid #e2d4c0;border-radius:16px;background:#fffdf8;padding:16px;text-align:center}img{width:100%;height:170px;object-fit:contain}h2{font-size:14px}p{line-height:1.7;font-size:12px}small{color:#82705e}</style></head><body><main><h1>유물 16종</h1><p>로컬 이미지·효과 미리보기 · 장착은 1개, 장착·해제 각각 500골드, 교체 1,000골드</p><section id="relics"></section></main><script type="module">const {fishing_relics}=await fetch('/supabase/catalog/catalog.json').then(r=>r.json());const labels={rare:'희귀',epic:'특급',mythic:'신화'};for(const relic of fishing_relics){const card=document.createElement('article');const image=document.createElement('img');image.src='/'+relic.thumbnail_path;image.alt=relic.name;const title=document.createElement('h2');title.textContent=relic.name;const grade=document.createElement('small');grade.textContent=labels[relic.rarity];const description=document.createElement('p');description.textContent=relic.description;card.append(image,title,grade,description);document.querySelector('#relics').append(card)}</script></body></html>
