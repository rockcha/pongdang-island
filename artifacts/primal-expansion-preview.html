<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>태고의 원시섬 신규 개체 미리보기</title>
<style>body{margin:0;background:#fff8ee;color:#493b30;font:15px system-ui;padding:24px}main{max-width:1200px;margin:auto}h1{font-size:23px}h2{font-size:16px;font-weight:500;margin-bottom:4px}p{line-height:1.7}section p{margin:0 0 8px;color:#92745e;font-size:13px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}canvas{display:block;width:100%;background:#174853;border-radius:12px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0}button,select{border:1px solid #d7b99f;border-radius:8px;padding:10px;background:#fff4e5;color:inherit}[hidden]{display:none!important}</style>
<main><h1>태고의 원시섬 · 생물 20종 / 장식물 14종</h1><p>모두 태고의 원시섬 전용입니다. 생물은 4프레임, 플리오스는 8프레임과 6초 주기 빛무늬 행동을 사용합니다. 수초 3종은 제자리에서 잎이 흔들립니다. 슬라이더로 프레임별 몸통 위치와 형태를 비교할 수 있습니다.</p><div class="controls"><select id="scope"><option value="all">전체</option><option value="common">일반</option><option value="rare">희귀</option><option value="epic">특급</option><option value="mythic">신화</option></select><button id="auto">자동 재생</button><button id="flip">좌우 반전</button><label>프레임 <input id="frame" type="range" min="0" max="7" value="0"></label><span id="phase">자동</span></div><div id="cards"></div><p id="status">이미지를 불러오는 중…</p></main><script src="./primal-expansion-preview.js"></script></html>
