<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>별잠 유적 · 파랑과 노랑</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff8e8;color:#233452;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:26px}p{line-height:1.6}.controls{position:sticky;top:0;z-index:3;background:#fff8e8ed;padding:12px 0;display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 16px;border:1px solid #c8b887;background:#fffdf2;border-radius:10px;color:inherit;cursor:pointer}.tank{height:470px;border-radius:20px;overflow:hidden;background:linear-gradient(#526eae,#1d3150 76%,#b7a77b)}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:25px}.card{border:1px solid #dacba8;border-radius:14px;overflow:hidden;background:#fffdf6}.card h2{font-size:14px;margin:12px}.art{height:220px;position:relative;display:grid;place-items:center;background:#f7eddb}.pinned{width:100%;height:220px;object-fit:contain}.actual{display:flex;justify-content:center;height:170px;align-items:center;background:#f7eddb}.art::after{content:'';position:absolute;left:12px;right:12px;top:50%;border-top:1px dashed #b29b6d55;pointer-events:none}.dark .art,.dark .actual{background:#203047}.card p{margin:8px 12px;font-size:12px;color:#6b6d75}.dark .card p{color:#6b6d75}@media(max-width:750px){main{padding:14px}#grid{grid-template-columns:repeat(2,1fr)}.art{height:190px}.pinned{height:190px}.tank{height:420px}}@media(max-width:420px){#grid{grid-template-columns:1fr}.art{height:250px}.pinned{height:250px}}</style>
<main><h1>별잠 유적 · 파랑과 노랑</h1><p>기존 16종의 새 그림과 모션. 위쪽은 위치를 고정한 반복 재생, 아래쪽은 실제 도감 미리보기입니다.</p><div class="controls"><button id="play">일시정지</button><button id="step">한 프레임씩</button><button id="light">어두운 배경</button><button id="reduced">모션 감소</button></div><div class="tank" id="tank"></div><p id="status">불러오는 중…</p><div id="grid"></div></main><script type="module" src="./starruins-bluegold-preview.ts"></script></html>
