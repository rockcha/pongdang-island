<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>장식품 애니메이션</title><style>body{font:16px system-ui;background:#edf3ff;padding:24px;color:#193354}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}article{background:white;padding:16px;border-radius:16px}canvas{width:100%;background:#dce9f8}img{max-width:100%}</style><h1>장식품 애니메이션</h1><p>기준점 보정 적용 · 게임과 동일한 1.2fps</p><main></main><script>const rows=[{"name":"루네아의 기록 서가","file":"decorations/epic/lunea-record-shelf_sprite.png","frames":[{"frame":0,"dx":0,"dy":0,"rmse":0},{"frame":1,"dx":-26,"dy":0,"rmse":19.13162243244649},{"frame":2,"dx":0,"dy":-26,"rmse":17.472042731968198},{"frame":3,"dx":-26,"dy":-26,"rmse":24.842507220820156}]}];for(const s of rows){const a=document.createElement("article"),h=document.createElement("h3");h.textContent=s.name;a.append(h);const c=document.createElement("canvas");c.width=600;c.height=600;a.append(c);const im=new Image();im.src=s.file;const ctx=c.getContext("2d");function draw(t){ctx.clearRect(0,0,600,600);if(im.complete&&im.naturalWidth){const cell=im.width/2,f=Math.floor(t/1000*1.2)%4,r=s.frames[f],size=360;ctx.drawImage(im,(f%2)*cell,Math.floor(f/2)*cell,cell,cell,300-size/2-r.dx/cell*size,300-size/2-r.dy/cell*size,size,size)}requestAnimationFrame(draw)}requestAnimationFrame(draw);const d=document.createElement("details"),summary=document.createElement("summary");summary.textContent="원본 시트";d.append(summary);const orig=document.createElement("img");orig.src=s.file;d.append(orig);a.append(d);document.querySelector("main").append(a)}</script>
