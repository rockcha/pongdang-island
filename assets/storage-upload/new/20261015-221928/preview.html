<!doctype html><meta charset="utf-8"><title>걷는 수호병</title><style>body{background:#17324f;color:white;font:16px system-ui}canvas{width:450px;max-width:100%}</style><h1>걷는 아틀란티스 수호병</h1><canvas width="700" height="700"></canvas><script>const rows=[{"frame":0,"dx":0,"dy":0,"rmse":0},{"frame":1,"dx":-9,"dy":0,"rmse":25.184874281242372},{"frame":2,"dx":1,"dy":-21,"rmse":27.782229441268257},{"frame":3,"dx":-9,"dy":-22,"rmse":33.51485269607595}];const im=new Image();im.src="fish/mythic/atlantean-sentinel-walk_sprite.png";const ctx=document.querySelector("canvas").getContext("2d");function draw(t){ctx.clearRect(0,0,700,700);if(im.complete&&im.naturalWidth){const cell=im.width/2,f=Math.floor(t/1000*3)%4,r=rows[f];ctx.drawImage(im,f%2*cell,Math.floor(f/2)*cell,cell,cell,100-r.dx/cell*500,100-r.dy/cell*500,500,500);}requestAnimationFrame(draw)}requestAnimationFrame(draw)</script>
