<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>특급 고래 미리보기</title><style>body{margin:24px;background:#203e46;color:#fff4e4;font-family:system-ui}body.light{background:#fff4e4;color:#613e29}button{padding:10px;margin:6px;border:0;border-radius:8px}main{display:flex;flex-wrap:wrap;gap:24px}article{text-align:center;border:1px solid #8888;border-radius:18px;padding:20px;min-width:260px}h2{font-size:18px}.viewport{height:220px;display:grid;place-items:center}.sprite{width:var(--size);height:var(--size);background-size:200% 200%;background-position:0 0;animation:swim 1.2s steps(1) infinite}.flip .sprite{transform:scaleX(-1)}.paused .sprite{animation:none}@keyframes swim{0%{background-position:0 0}25%{background-position:100% 0}50%{background-position:0 100%}75%{background-position:100% 100%}}@media(prefers-reduced-motion:reduce){.sprite{animation:none}}</style><h1>특급 공통종 고래</h1><button onclick="document.body.classList.toggle('light')">밝은 배경 / 어두운 배경</button><button onclick="document.body.classList.toggle('flip')">방향 전환</button><button onclick="document.body.classList.toggle('paused')">정지 / 재생</button><main><article><h2>호박빛 향유고래</h2><div class="viewport"><div class="sprite" style="--size:168px;background-image:url('fish/epic/shared-amber-sperm-whale_v1_sprite.png')"></div></div><p>1,100 골드</p></article><article><h2>청옥등 혹등고래</h2><div class="viewport"><div class="sprite" style="--size:174px;background-image:url('fish/epic/shared-jadeback-humpback_v1_sprite.png')"></div></div><p>1,150 골드</p></article><article><h2>비단등 긴수염고래</h2><div class="viewport"><div class="sprite" style="--size:182px;background-image:url('fish/epic/shared-silkback-fin-whale_v1_sprite.png')"></div></div><p>1,000 골드</p></article><article><h2>노을배 대왕고래</h2><div class="viewport"><div class="sprite" style="--size:190px;background-image:url('fish/epic/shared-sunset-belly-blue-whale_v1_sprite.png')"></div></div><p>1,200 골드</p></article></main></html>
