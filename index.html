<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#fff8ee" />
    <meta name="description" content="손끝에서 시작하는 작은 낚시 여행, 퐁당섬" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        if (localStorage.getItem('pongdang:theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="color-scheme"]').content = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#241c17';
        }
      } catch {}
    </script>
    <title>퐁당섬</title>
  </head>
  <body>
    <div id="app-startup" role="status" style="position:fixed;inset:0;z-index:2147483647;display:grid;place-content:center;gap:16px;padding:24px;text-align:center;background:#fff8ee;color:#49382d;font-family:system-ui,sans-serif">
      <strong id="app-startup-title">퐁당섬을 여는 중이에요</strong>
      <p id="app-startup-detail">잠시만 기다려 주세요.</p>
      <button id="app-startup-retry" hidden type="button" style="min-height:44px;border:1px solid currentColor;border-radius:12px;padding:10px 20px;background:transparent;color:inherit;font:inherit">다시 시도</button>
      <button id="app-startup-repair" hidden type="button" style="min-height:44px;border:0;background:transparent;color:inherit;font:inherit;text-decoration:underline">계속 안 열리면 앱 파일 복구</button>
    </div>
    <style>#app-startup[hidden]{display:none!important}</style>
    <script id="app-startup-script">
      // Independent of the application bundle: failed imports still have a recovery UI.
      ;(function () {
        var panel = document.getElementById('app-startup')
        var title = document.getElementById('app-startup-title')
        var detail = document.getElementById('app-startup-detail')
        var retry = document.getElementById('app-startup-retry')
        var repair = document.getElementById('app-startup-repair')
        var ready = false
        function fail(reason, source) {
          clearTimeout(timer)
          panel.hidden = false
          title.textContent = '앱을 불러오지 못했어요'
          detail.textContent = '인터넷 연결을 확인하고 다시 시도해 주세요.'
          retry.hidden = false
          repair.hidden = false
          // Technical identifiers only; never auth URLs, tokens or user data.
          try {
            sessionStorage.setItem('pongdang:last-startup-error', JSON.stringify({
              at: new Date().toISOString(), reason: reason,
              file: source ? new URL(source, location.href).pathname.split('/').pop() : null,
              build: document.querySelector('script[type="module"][src]')?.getAttribute('src')?.split('?')[0],
            }))
          } catch {}
        }
        var timer = setTimeout(function () { fail('startup-timeout') }, 20000)
        window.pongdangStartup = {
          ready: function () { ready = true; clearTimeout(timer); panel.hidden = true },
          fail: fail,
        }
        window.addEventListener('error', function (event) {
          if (!ready && (event.filename || event.target?.tagName === 'SCRIPT')) {
            fail('startup-error', event.filename || event.target.src)
          }
        }, true)
        window.addEventListener('unhandledrejection', function () {
          if (!ready) fail('startup-rejection')
        })
        window.addEventListener('vite:preloadError', function () { fail('module-load-error') })
        retry.addEventListener('click', function () {
          // User initiated only: no reload loops or deletion of login/game data.
          location.reload()
        })
        repair.addEventListener('click', async function () {
          retry.disabled = repair.disabled = true
          detail.textContent = '앱 파일을 다시 준비하고 있어요.'
          var controller = new AbortController()
          var timeout = setTimeout(function () { controller.abort() }, 10000)
          try {
            // Verify connectivity before releasing the offline copy. Discard the response:
            // auth callbacks can contain sensitive query parameters, so use the root URL.
            // A distinct query also bypasses Workbox's cached navigation/index match.
            var response = await fetch('/?pongdang-repair=' + Date.now(), {cache:'no-store',signal:controller.signal})
            if (!response.ok || !response.headers.get('content-type')?.includes('text/html')) throw new Error('offline')
            if ('serviceWorker' in navigator) {
              var registration = await navigator.serviceWorker.getRegistration('/')
              if (registration && registration.scope === new URL('/', location.href).href) await registration.unregister()
            }
            if ('caches' in window) {
              var names = await caches.keys()
              // Workbox names include the registration scope. Preserve all other caches.
              var suffix = new URL('/', location.href).href
              await Promise.all(names.filter(function (name) {
                return name.startsWith('workbox-precache-') && name.endsWith(suffix)
              }).map(function (name) { return caches.delete(name) }))
            }
            location.reload()
          } catch {
            detail.textContent = '복구하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'
            retry.disabled = repair.disabled = false
          } finally { clearTimeout(timeout) }
        })
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
